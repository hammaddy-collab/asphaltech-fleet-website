<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asphaltech Fleet Register</title>
<style>
  :root{
    --navy:#2E3F80; --sky:#6AA2CC; --yellow:#EAC53D;
    --bg:#f4f6fb; --card:#ffffff; --border:#e2e6ee; --text:#1f2433; --muted:#6b7280;
    --danger:#d64545; --success:#1f9d55; --warn:#b8860b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .app{width:100%;margin:0;padding:20px 28px 60px;}
  header.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{width:42px;height:42px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;}
  .brand h1{font-size:20px;margin:0;color:var(--navy);font-weight:700;}
  .brand .sub{font-size:12px;color:var(--muted);}
  .role-select{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 10px;}
  .role-select select{border:none;background:transparent;font-weight:600;font-size:13px;color:var(--navy);outline:none;}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  nav.tabs button{border:1px solid var(--border);background:var(--card);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;}
  nav.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  nav.tabs button .badge{background:var(--yellow);color:#3a2c00;border-radius:999px;font-size:11px;padding:1px 6px;font-weight:700;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 1px 3px rgba(16,24,40,.05);}
  .card h2{margin:0 0 4px;font-size:15px;color:var(--navy);}
  .card .desc{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
  .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .stat .num{font-size:22px;font-weight:700;color:var(--navy);}
  .stat .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;background:var(--navy);color:#fff;padding:10px 12px;position:sticky;top:0;font-weight:600;white-space:nowrap;}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{background:#243366;}
  td{padding:9px 12px;border-bottom:1px solid var(--border);}
  tbody tr:nth-child(even) td{background:#fafbfd;}
  tr:hover td{background:#f0f4fa;}
  .tablewrap{overflow:auto;max-height:calc(100vh - 320px);min-height:240px;border-radius:10px;border:1px solid var(--border);}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .pill.current{background:#e4f7ec;color:var(--success);}
  .pill.sold{background:#fbeaea;color:var(--danger);}
  .pill.stage{background:#fff6e0;color:var(--warn);}
  .pill.complete{background:#e4f7ec;color:var(--success);}
  .formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11.5px;font-weight:600;color:var(--muted);}
  .field input, .field select, .field textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;color:var(--text);font-family:inherit;}
  .field textarea{resize:vertical;}
  .section-label{margin:18px 0 8px;font-size:12.5px;font-weight:700;color:var(--sky);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);padding-bottom:6px;}
  .btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  button.primary{background:var(--navy);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  button.primary:hover{background:#243366;}
  button.secondary{background:#fff;color:var(--navy);border:1px solid var(--navy);padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  button.small{padding:5px 10px;font-size:11.5px;border-radius:6px;}
  .task{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fbfcfe;}
  .task .meta{font-size:12px;color:var(--muted);}
  .task .title{font-weight:700;font-size:13.5px;color:var(--navy);}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 0;}
  .locked-note{background:#fff6e0;border:1px solid #f0d999;color:#8a6500;border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;}
  .access-denied{text-align:center;padding:60px 20px;color:var(--muted);}
  .access-denied .icon{font-size:40px;margin-bottom:10px;}
  .filterbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .filterbar input{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;flex:1 1 260px;min-width:220px;}
  .filterbar select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;min-width:150px;background:#fff;}
  .filter-count{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.15);display:none;z-index:50;}
  .checklist-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;}
  .checklist-item input{width:16px;height:16px;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<script>
// ===================== CLOUD STORAGE ADAPTER (Google Apps Script backend) =====================
// This app is a single static file — it can be emailed, put on a shared drive, or hosted
// anywhere. All shared data lives in a small Google Apps Script Web App that everyone's
// copy of this file talks to. Paste that deployment URL below (see setup guide).
const API_URL_DEFAULT = "https://asphaltech-fleet-backend-production.up.railway.app/";
const API_URL = (function(){
  try {
    const override = window.localStorage.getItem('fleetapp_api_url_override');
    return (override && override.trim()) || API_URL_DEFAULT;
  } catch(e){ return API_URL_DEFAULT; }
})();

function apiConfigured(){
  return !!API_URL && API_URL.indexOf('PASTE_YOUR') === -1;
}

// The "Open app" link included in task emails. This can't just be
// window.location.href - that's whatever's in the sender's own address bar
// (their local file path or their browser session), which means nothing to
// the person receiving the email. Instead it's a fixed link everyone shares
// (e.g. a SharePoint/OneDrive link to this file), editable in Admin without
// needing a new copy of the app from Claude each time it changes.
const APP_LINK_DEFAULT = "https://idiaus.sharepoint.com/:u:/s/WA-Accounts/IQA5mBfrKjDiSKVpPytY-AWMAdHpC2nHYVM6HnWwlEMclV0?e=ZEu5hT&download=1";
let APP_LINK = APP_LINK_DEFAULT;

async function cloudGet(){
  if (!apiConfigured()) return null;
  try {
    const r = await fetch(API_URL, { method:'GET' });
    if (!r.ok) return null;
    return await r.json();
  } catch(e){ console.warn('Cloud read failed:', e); return null; }
}

async function cloudSet(payload){
  if (!apiConfigured()) return false;
  try {
    await fetch(API_URL, {
      method:'POST',
      // text/plain avoids a CORS preflight, which Apps Script Web Apps don't handle
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({action:'save'}, payload))
    });
    return true;
  } catch(e){ console.warn('Cloud write failed:', e); return false; }
}

async function cloudSendEmail(to, subject, body){
  if (!apiConfigured()) return false;
  try {
    const r = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'email', to, subject, body })
    });
    if (!r.ok) { console.warn('Cloud email failed: HTTP', r.status); return false; }
    const data = await r.json().catch(()=>null);
    if (!data || !data.ok) { console.warn('Cloud email failed:', data && data.error); return false; }
    return true;
  } catch(e){ console.warn('Cloud email failed:', e); return false; }
}

// Local backup so nothing is lost even if the network/API is briefly unavailable
function backupLocally(){
  try { window.localStorage.setItem('fleetapp_backup', JSON.stringify({assets:state.assets, disposed:state.disposed, settings:state.settings})); } catch(e){}
}
function restoreLocalBackup(){
  try {
    const raw = window.localStorage.getItem('fleetapp_backup');
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}

function applySettingsToRuntime(){
  const s = state.settings || {};
  if (s.pins) Object.assign(ROLE_PINS, s.pins);
  if (s.adminPin) ROLE_PINS['Admin'] = s.adminPin;
  if (s.stageOwners) Object.assign(STAGE_OWNER, s.stageOwners);
  if (s.disposalStageOwners) Object.assign(DISPOSAL_STAGE_OWNER, s.disposalStageOwners);
  if (isValidOrder(s.stageOrder, Object.keys(STAGE_OWNER))) STAGE_ORDER = s.stageOrder.slice();
  if (isValidOrder(s.disposalStageOrder, Object.keys(DISPOSAL_STAGE_OWNER))) DISPOSAL_STAGE_ORDER = s.disposalStageOrder.slice();
  if (s.fieldAssignments){
    Object.keys(s.fieldAssignments).forEach(key=>{
      if (FIELD_ASSIGNMENTS.hasOwnProperty(key) && Object.keys(STAGE_OWNER).includes(s.fieldAssignments[key])){
        FIELD_ASSIGNMENTS[key] = s.fieldAssignments[key];
      }
    });
  }
  if (s.disposalChecklistAssignments){
    Object.keys(s.disposalChecklistAssignments).forEach(key=>{
      if (DISPOSAL_CHECKLIST_ASSIGNMENTS.hasOwnProperty(key) && Object.keys(DISPOSAL_STAGE_OWNER).includes(s.disposalChecklistAssignments[key])){
        DISPOSAL_CHECKLIST_ASSIGNMENTS[key] = s.disposalChecklistAssignments[key];
      }
    });
  }
  if (Array.isArray(s.customFields)){
    CUSTOM_FIELDS = s.customFields
      .filter(f => f && f.key && f.label && CUSTOM_FIELD_SECTIONS.includes(f.section))
      .map(buildCustomFieldRuntime);
  }
  if (s.appLink && s.appLink.trim()) APP_LINK = s.appLink.trim();
}

async function loadData(){
  const cloud = await cloudGet();
  if (cloud && Array.isArray(cloud.assets) && cloud.assets.length){
    state.assets = cloud.assets;
    state.disposed = Array.isArray(cloud.disposed) ? cloud.disposed : [];
    state.settings = cloud.settings || {};
  } else {
    // No cloud data yet (first run ever), or the API is unreachable right now.
    const local = restoreLocalBackup();
    if (local && Array.isArray(local.assets) && local.assets.length){
      state.assets = local.assets;
      state.disposed = local.disposed || [];
      state.settings = local.settings || {};
    } else {
      state.assets = JSON.parse(document.getElementById('seed-data').textContent);
      state.disposed = [];
      state.settings = {};
    }
    // If the API answered but was just empty, seed it so every teammate starts from the same data.
    if (cloud !== null) await cloudSet({assets: state.assets, disposed: state.disposed, settings: state.settings});
  }
  applySettingsToRuntime(); // pins/routing saved by Admin now actually take effect for everyone
  backupLocally();
  state.loaded = true;
}

async function saveAssets(){
  backupLocally();
  await cloudSet({assets: state.assets, disposed: state.disposed, settings: state.settings});
}

async function saveDisposed(){
  return saveAssets(); // assets & disposed are always persisted together
}

async function storageGet(key){
  try { return window.localStorage.getItem('fleetapp_'+key); } catch(e){ return null; }
}
async function storageSet(key, value){
  if (key === 'fleet_settings') { await saveAssets(); } // pushes state.settings up to the cloud too
  try { window.localStorage.setItem('fleetapp_'+key, value); } catch(e){ /* ignore */ }
}


// ===================== STATE =====================
const ROLES = ["CEO / Peter", "Fleet Maintenance", "Accounts", "HR", "General Staff", "Admin"];
const ROLE_PINS = {
  "CEO / Peter": "9999",
  "Fleet Maintenance": "9999",
  "Accounts": "9999",
  "HR": "9999",
  "General Staff": null,
  "Admin": "9999",
};
const STAGE_OWNER = {
  "Pending Fleet Maintenance": "Fleet Maintenance",
  "Pending Accounts": "Accounts",
  "Pending HR": "HR",
};
const DISPOSAL_STAGE_OWNER = {
  "Disposal: Pending Accounts": "Accounts",
  "Disposal: Pending Administration": "HR", // Administration handled by HR/Admin role in this prototype
};
const FULL_ACCESS_ROLES = ["CEO / Peter", "Fleet Maintenance", "Accounts", "HR"];

// The workflow stage stored on an asset (e.g. "Pending Accounts") is a fixed
// internal key the state machine relies on - it must never change. But WHO
// owns that stage is reassignable in Admin > Workflow Routing, so the label
// shown to users should reflect the *current* owner, not the stage's
// original name (otherwise reassigning "Pending Accounts" to HR would still
// show "Pending Accounts" everywhere, which is exactly the confusion this fixes).
function stageDisplayLabel(stage){
  if (!stage || stage === 'Complete') return stage;
  const owner = STAGE_OWNER[stage] || DISPOSAL_STAGE_OWNER[stage];
  if (!owner) return stage;
  return stage.startsWith('Disposal:') ? `Disposal: Pending ${owner}` : `Pending ${owner}`;
}

// ----- Workflow order -----
// Each stage keeps a fixed set of fields it collects (Fleet Maintenance always
// asks for rego/VIN/risk assessment, no matter when it runs) - but WHICH ORDER
// the three sections happen in, for new fleet requests and for disposals, is
// admin-editable here. STAGE_OWNER/DISPOSAL_STAGE_OWNER (above) separately
// control WHO handles each section; this controls WHEN it happens.
let STAGE_ORDER = ['Pending Fleet Maintenance', 'Pending Accounts', 'Pending HR'];
let DISPOSAL_STAGE_ORDER = ['Disposal: Pending Accounts', 'Disposal: Pending Administration'];

const STAGE_TYPE_LABELS = {
  'Pending Fleet Maintenance': 'Fleet Maintenance (rego, VIN, risk assessment, fire extinguisher)',
  'Pending Accounts': 'Accounts (delivery date, finance, fuel fob, fleet card)',
  'Pending HR': 'HR (division, driver)',
};
const DISPOSAL_STAGE_TYPE_LABELS = {
  'Disposal: Pending Accounts': 'Accounts (invoice, fuel fob/fleet card, finance close-out)',
  'Disposal: Pending Administration': 'Administration (insurance, corporate accountant, archive)',
};
const STAGE_SECTION_DESCRIPTIONS = {
  'Pending Fleet Maintenance': 'the Fleet Maintenance section (registration, VIN, risk assessment, fire extinguisher details)',
  'Pending Accounts': 'the Accounts section (delivery date, finance details, fuel fob, fleet card)',
  'Pending HR': 'the HR section (division and driver allocation)',
};
const DISPOSAL_SECTION_DESCRIPTIONS = {
  'Disposal: Pending Accounts': 'the Accounts steps (create invoice, cancel/transfer fuel fob and fleet card, close out finance/lease)',
  'Disposal: Pending Administration': 'the Administration steps (notify insurance, notify Ian Boyes, archive documents)',
};

function isValidOrder(order, validTypes){
  return Array.isArray(order) && order.length === validTypes.length &&
    new Set(order).size === validTypes.length &&
    order.every(s => validTypes.includes(s));
}

// Returns the next stage name in the given order (defaults to the global
// Admin-configured STAGE_ORDER), or 'Complete' once the last section in that
// order has finished. Pass an asset's own requestStageOrder here so a request
// that was sent to a different section first still follows its own path,
// instead of snapping back to the global default order.
function nextStage(current, order){
  order = order || STAGE_ORDER;
  const idx = order.indexOf(current);
  if (idx === -1 || idx === order.length - 1) return 'Complete';
  return order[idx + 1];
}

// Returns the next disposal stage name, or null once the last configured
// disposal section has finished (signalling "finalise and remove from register").
function nextDisposalStage(current){
  const idx = DISPOSAL_STAGE_ORDER.indexOf(current);
  if (idx === -1 || idx === DISPOSAL_STAGE_ORDER.length - 1) return null;
  return DISPOSAL_STAGE_ORDER[idx + 1];
}

// Whether a given register column should currently be shown. Defaults to
// visible — Admin > Register Columns stores explicit `false` entries only for
// columns someone has unticked, so anything not yet configured stays visible
// (and fleetNo can never be hidden, since Edit relies on it being on the row).
function isRegisterColumnVisible(key){
  if (key === 'fleetNo') return true;
  const visibility = (state.settings && state.settings.registerColumns) || {};
  return visibility[key] !== false;
}

function renderFieldInput(f, a){
  const val = (a[f.key] !== undefined && a[f.key] !== null) ? a[f.key] : '';
  if (f.type === 'select'){
    return `<div class="field"><label>${f.label}</label><select id="t-${f.key}">
      ${f.options.map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join('')}
    </select></div>`;
  }
  if (f.type === 'textarea'){
    return `<div class="field" style="grid-column:1/-1;"><label>${f.label}</label><textarea id="t-${f.key}" rows="2">${val}</textarea></div>`;
  }
  const inputType = f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text');
  return `<div class="field"><label>${f.label}</label><input id="t-${f.key}" type="${inputType}" value="${val}"></div>`;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(()=>{ t.style.display='none'; }, 3200);
}

function nextFleetNo(prefix){
  // Some seed data has fleetNo stored as a number instead of text (e.g. 3667) -
  // coerce to string defensively so this never crashes on those records.
  const nums = state.assets.filter(a=>a.fleetNo && String(a.fleetNo).startsWith(prefix))
    .map(a=>parseInt(String(a.fleetNo).replace(prefix,''))||0);
  const max = nums.length ? Math.max(...nums) : 0;
  return prefix + String(max+1).padStart(2,'0');
}

// ===================== RENDER ROOT =====================
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderHeader());
  app.appendChild(renderTabs());
  const content = document.createElement('div');
  content.id = 'tab-content';
  app.appendChild(content);
  renderTabContent(content);
}

function renderHeader(){
  const header = document.createElement('header');
  header.className = 'top';
  header.innerHTML = `
    <div class="brand">
      <div class="logo">A</div>
      <div>
        <h1>Asphaltech Fleet Register</h1>
        <div class="sub">Vehicle &amp; Equipment Register</div>
      </div>
    </div>
  `;
  const roleWrap = document.createElement('div');
  roleWrap.className = 'role-select';
  roleWrap.innerHTML = `<span style="font-size:12px;color:var(--muted);">Viewing as:</span>`;
  const sel = document.createElement('select');
  ROLES.forEach(r=>{
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    if (r === state.role) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = (e)=>{
    const newRole = e.target.value;
    const pin = ROLE_PINS[newRole];
    if (!pin){
      state.role = newRole; window.__lastRole = state.role;
      if (!canSeeTab(state.tab)) state.tab = 'dashboard';
      render();
      notifyPendingTasks(newRole);
      return;
    }
    promptForPin(newRole, sel);
  };
  roleWrap.appendChild(sel);
  header.appendChild(roleWrap);
  return header;
}

function promptForPin(newRole, selEl){
  const overlay = document.createElement('div');
  overlay.style = 'position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:70;';
  const box = document.createElement('div');
  box.style = 'background:#fff;border-radius:14px;padding:24px;max-width:340px;width:90%;text-align:center;';
  box.innerHTML = `
    <div style="font-size:28px;margin-bottom:6px;">&#128274;</div>
    <h2 style="color:var(--navy);margin:0 0 4px;font-size:16px;">Enter PIN for ${newRole}</h2>
    <div style="font-size:12px;color:var(--muted);margin-bottom:14px;">Ask your manager or department lead for this code.</div>
    <input id="pin-input" type="password" maxlength="6" style="width:100%;text-align:center;font-size:20px;letter-spacing:4px;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;">
    <div id="pin-error" style="color:var(--danger);font-size:12px;height:16px;margin-bottom:10px;"></div>
    <div class="btnrow" style="justify-content:center;">
      <button class="primary" id="pin-confirm">Unlock</button>
      <button class="secondary" id="pin-cancel">Cancel</button>
    </div>`;
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  const input = box.querySelector('#pin-input');
  input.focus();
  const close = ()=>{ selEl.value = state.role; document.body.removeChild(overlay); };
  box.querySelector('#pin-cancel').onclick = close;
  overlay.onclick = (e)=>{ if (e.target===overlay) close(); };
  const tryUnlock = ()=>{
    if (input.value === ROLE_PINS[newRole]){
      state.role = newRole; window.__lastRole = state.role;
      if (!canSeeTab(state.tab)) state.tab = 'dashboard';
      document.body.removeChild(overlay);
      render();
      notifyPendingTasks(newRole);
    } else {
      box.querySelector('#pin-error').textContent = 'Incorrect PIN.';
      input.value=''; input.focus();
    }
  };
  box.querySelector('#pin-confirm').onclick = tryUnlock;
  input.onkeydown = (e)=>{ if (e.key==='Enter') tryUnlock(); };
}

function pendingCountFor(role){
  return state.assets.filter(a => STAGE_OWNER[a.workflowStage] === role).length
       + state.assets.filter(a => DISPOSAL_STAGE_OWNER[a.workflowStage] === role).length;
}

// Pops a toast the moment someone switches into a role that has waiting tasks -
// this is the in-app "notification", no email needed.
function notifyPendingTasks(role){
  const n = pendingCountFor(role);
  if (n > 0){
    showToast(`\u{1F514} You have ${n} task${n===1?'':'s'} waiting in My Tasks`);
  }
}

function canSeeTab(tab){
  if (tab === 'dashboard' || tab === 'summary') return true;
  if (tab === 'addfleet') return state.role !== 'General Staff';
  if (tab === 'tasks') return state.role !== 'General Staff';
  if (tab === 'register') return FULL_ACCESS_ROLES.includes(state.role) || state.role === 'Admin';
  if (tab === 'disposal') return FULL_ACCESS_ROLES.includes(state.role) || state.role === 'Admin';
  if (tab === 'admin') return state.role === 'Admin' || state.role === 'Accounts';
  return false;
}

function renderTabs(){
  const nav = document.createElement('nav');
  nav.className = 'tabs';
  const tabs = [
    {id:'dashboard', label:'Dashboard'},
    {id:'summary', label:'Summary (Limited View)'},
    {id:'register', label:'Full Register'},
    {id:'tasks', label:'My Tasks', count: state.role!=='General Staff' && state.role!=='Admin' ? pendingCountFor(state.role==='CEO / Peter'?'__none__':state.role) : 0},
    {id:'addfleet', label:'+ Add New Fleet'},
    {id:'disposal', label:'Disposal'},
    {id:'admin', label:'⚙ Admin'},
  ];
  tabs.forEach(t=>{
    if (!canSeeTab(t.id)) return;
    const btn = document.createElement('button');
    btn.className = state.tab === t.id ? 'active' : '';
    btn.innerHTML = t.label + (t.count ? ` <span class="badge">${t.count}</span>` : '');
    btn.onclick = ()=>{ state.tab = t.id; render(); };
    nav.appendChild(btn);
  });
  return nav;
}

  if (!canSeeTab(state.tab)){

      <strong>You don't have access to this view.</strong><br>Switch role above, or use Summary / Dashboard.</div></div>`;
    return;
  }
  if (state.tab === 'dashboard') return renderDashboard(container);
  if (state.tab === 'summary') return renderSummary(container);
  if (state.tab === 'register') return renderRegister(container);
  if (state.tab === 'tasks') return renderTasks(container);
  if (state.tab === 'addfleet') return renderAddFleet(container);
  if (state.tab === 'disposal') return renderDisposal(container);
  if (state.tab === 'admin') return renderAdmin(container);
}

  return inProgress.slice(0,6).map(a=>`

function uniqueValues(rows, key){

function renderFilterBar(scope, rows){

    <span class="filter-count" id="filter-${scope}-count"></span>

// Per-scope sort state so clicking a column header toggles ascending/descending.
// Persisted to localStorage so the chosen sort survives closing/reopening the
// app (previously this was a plain in-memory object that reset to {} on every
// page load, which silently discarded any sort the user picked).
function loadTableSort(){
  try {
    const raw = window.localStorage.getItem('fleetapp_tableSort');
    return raw ? JSON.parse(raw) : {};
  } catch(e){ return {}; }
}
function saveTableSort(){
  try { window.localStorage.setItem('fleetapp_tableSort', JSON.stringify(tableSort)); } catch(e){ /* ignore */ }
}
const tableSort = loadTableSort();

function wireFilter(scope, rows, cols, labels, rowRenderer){
  const input = document.getElementById(`filter-${scope}`);
  const divSel = document.getElementById(`filter-${scope}-division`);
  const catSel = document.getElementById(`filter-${scope}-category`);
  const countEl = document.getElementById(`filter-${scope}-count`);
  const table = document.getElementById(`${scope}-table`);
  if (!table) return;

  function apply(){
    const q = (input && input.value || '').trim().toLowerCase();
    const divVal = divSel ? divSel.value : '';
    const catVal = catSel ? catSel.value : '';
    let filtered = rows.filter(a=>{
      if (divVal && a.division !== divVal) return false;
      if (catVal && a.category !== catVal) return false;
      if (q && !cols.some(c=>String(a[c]||'').toLowerCase().includes(q))) return false;
      return true;
    });

    const sort = tableSort[scope];
    if (sort && sort.col){
      filtered = filtered.slice().sort((x,y)=>{
        const vx = x[sort.col], vy = y[sort.col];
        const ex = vx !== undefined && vx !== null && vx !== '';
        const ey = vy !== undefined && vy !== null && vy !== '';
        if (!ex && !ey) return 0;
        if (!ex) return 1;
        if (!ey) return -1;
        if (typeof vx === 'number' && typeof vy === 'number') return (vx - vy) * sort.dir;
        return String(vx).localeCompare(String(vy)) * sort.dir;
      });
    }

    const headCells = labels.map((label, i)=>{
      const col = cols[i];
      if (!col) return `<th></th>`;
      const active = sort && sort.col === col;
      const arrow = active ? (sort.dir === 1 ? ' &#9650;' : ' &#9660;') : '';
      return `<th class="sortable" data-col="${col}">${label}${arrow}</th>`;
    }).join('');

    const rowsHtml = filtered.map(a=> rowRenderer ? rowRenderer(a, cols) : `<tr>${cols.map(c=>`<td>${a[c]||''}</td>`).join('')}</tr>`).join('');

    table.innerHTML = `<thead><tr>${headCells}</tr></thead><tbody>${rowsHtml || `<tr><td colspan="${labels.length}" class="empty">No matching assets.</td></tr>`}</tbody>`;

    if (countEl) countEl.textContent = `Showing ${filtered.length} of ${rows.length}`;

    table.querySelectorAll('th.sortable').forEach(th=>{
      th.onclick = ()=>{
        const col = th.dataset.col;
        const cur = tableSort[scope] || { col: null, dir: 1 };
        if (cur.col === col) cur.dir = -cur.dir; else { cur.col = col; cur.dir = 1; }
        tableSort[scope] = cur;
        saveTableSort();
        apply();
      };
    });

    if (rowRenderer === renderRegisterRow) wireEditButtons();
  }

  if (input) input.oninput = apply;
  if (divSel) divSel.onchange = apply;
  if (catSel) catSel.onchange = apply;
  apply();
}

      ${renderFilterBar('register', state.assets)}
      <div class="tablewrap"><table id="register-table"></table></div>
    </div>`;
  wireFilter('register', state.assets, cols, labels, renderRegisterRow);
}
function renderRegisterRow(a, cols){
  return `<tr>${cols.map(c=>{
    if (c==='status') return `<td><span class="pill ${a.status==='Sold'?'sold':'current'}">${a.status}</span></td>`;
    if (c==='workflowStage') return `<td><span class="pill ${a.workflowStage==='Complete'?'complete':'stage'}">${stageDisplayLabel(a.workflowStage)}</span></td>`;
    if (c==='purchasePrice' || c==='financedAmount' || c==='insuredValue') return `<td>${a[c]? '$'+Number(a[c]).toLocaleString(): ''}</td>`;
    return `<td>${a[c]||''}</td>`;
  }).join('')}<td><button class="secondary small edit-btn" data-fleet="${a.fleetNo}">Edit</button></td></tr>`;
}
function wireEditButtons(){
  document.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const asset = state.assets.find(a=>a.fleetNo===btn.dataset.fleet);
      if (asset) openEditModal(asset);
    };
  });
}

const EDIT_FIELDS_BASE = [
  ['category','Category'],['make','Make'],['model','Model'],['year','Year of Manufacture'],
  ['rego','Registration No.'],['vin','Serial No./VIN No.'],['riskAssessment','Risk Assessment'],
  ['warrantyYears','Warranty Years'],['warrantyHours','Warranty Hours'],['warrantyKm','Warranty Kilometres'],
  ['fireExtId','Fire Extinguisher ID'],['fireExtSize','Fire Extinguisher Size'],
  ['division','Division'],['driver','Driver'],['comments','Comments'],
  ['owner','Owner'],['deliveryDate','Delivery Date'],['purchasePrice','Purchase Price (ex-GST)'],
  ['paymentType','Payment Type'],['financedAmount','Financed Amount'],['financeTerm','Finance Term (mths)'],
  ['financeEndDate','Finance End Date'],['financeAgreementNo','Finance Agreement Number'],
  ['insuredValue','Insured Value'],['fuelFob','iPetro Fuel Fob'],['fleetCard','Fleet Card Number'],
  ['status','Status'],
];
// Custom fields (Admin > Custom Fields) get folded in here too, so the full
// Edit modal on the Master Register always covers everything captured
// anywhere in the flow, regardless of which section originally asked for it.
function getEditFields(){
  return EDIT_FIELDS_BASE.concat(CUSTOM_FIELDS.map(f=>[f.key, `${f.label} (${CUSTOM_FIELD_SECTION_LABELS[f.section] ? (f.section==='AddFleetRequest'?'New Request':STAGE_OWNER[f.section]) : f.section})`]));
}

function renderEditFieldInput(key, label, asset){
  if (key==='status') return `<div class="field"><label>${label}</label><select id="e-${key}">
      <option ${asset.status==='Current'?'selected':''}>Current</option>
      <option ${asset.status==='Sold'?'selected':''}>Sold</option>
    </select></div>`;
  if (key==='comments') return `<div class="field" style="grid-column:1/-1;"><label>${label}</label><textarea id="e-${key}" rows="2">${asset[key]||''}</textarea></div>`;
  const custom = CUSTOM_FIELDS.find(f=>f.key===key);
  if (custom && custom.type==='textarea') return `<div class="field" style="grid-column:1/-1;"><label>${label}</label><textarea id="e-${key}" rows="2">${asset[key]||''}</textarea></div>`;
  if (custom && custom.type==='select') return `<div class="field"><label>${label}</label><select id="e-${key}">${custom.options.map(o=>`<option ${asset[key]===o?'selected':''}>${o}</option>`).join('')}</select></div>`;
  const inputType = custom && custom.type==='number' ? 'number' : (custom && custom.type==='date' ? 'date' : 'text');
  return `<div class="field"><label>${label}</label><input id="e-${key}" type="${inputType}" value="${(asset[key]!==undefined && asset[key]!==null)?asset[key]:''}"></div>`;
}

function openEditModal(asset){
  const overlay = document.createElement('div');
  overlay.style = 'position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:60;';
  const box = document.createElement('div');
  box.style = 'background:#fff;border-radius:14px;padding:22px;max-width:680px;width:94%;max-height:85vh;overflow:auto;';
  box.innerHTML = `
    <h2 style="color:var(--navy);margin-top:0;">Edit ${asset.fleetNo} — ${asset.make} ${asset.model}</h2>
    <div class="formgrid">
      ${getEditFields().map(([key,label])=>renderEditFieldInput(key,label,asset)).join('')}
    </div>
    <div class="btnrow">
      <button class="primary" id="e-save">Save changes</button>
      <button class="secondary" id="e-cancel">Cancel</button>
    </div>`;
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if (e.target===overlay) document.body.removeChild(overlay); };
  box.querySelector('#e-cancel').onclick = ()=> document.body.removeChild(overlay);
  box.querySelector('#e-save').onclick = async ()=>{
    const idx = state.assets.findIndex(a=>a.fleetNo===asset.fleetNo);
    if (idx===-1) return;
    getEditFields().forEach(([key])=>{
      const el = box.querySelector(`#e-${key}`);
      if (el) state.assets[idx][key] = el.value;
    });
    await saveAssets();
    showToast(`${asset.fleetNo} updated.`);
    document.body.removeChild(overlay);
    render();
  };
}

async function submitNewFleet(){
  const category = document.getElementById('f-category').value;
  const make = document.getElementById('f-make').value.trim();
  const model = document.getElementById('f-model').value.trim();
  const year = document.getElementById('f-year').value.trim();
  const price = document.getElementById('f-price').value.trim();
  const division = document.getElementById('f-division').value;
  const owner = document.getElementById('f-owner').value;
  const paymentType = document.getElementById('f-paytype').value;
  const driver = document.getElementById('f-driver').value.trim();
  if (!make || !model){ showToast('Please enter at least Make and Model.'); return; }

  const customAddFieldValues = {};
  CUSTOM_FIELDS.filter(f=>f.section==='AddFleetRequest').forEach(f=>{
    const el = document.getElementById(`t-${f.key}`);
    if (el) customAddFieldValues[f.key] = el.value;
  });

  const prefixMap = {"Light Vehicle":"LV","Heavy Vehicle":"HV","Excavator":"EX","Skid Steer Loader":"LS","Service Truck":"CT","Plant Trailer":"TP","Wheel Loader":"LW","Paver Wheeled":"PW","Paver Tracked":"PT","Tandem Roller":"RT","Multi Tyred Roller":"RM","Road Profiler":"RP","Forklift":"FL","Generator":"GE","Mobile Plant":"MP","Other":"XX"};
  const prefix = prefixMap[category] || "XX";
  const fleetNo = nextFleetNo(prefix);

  // "Send first to" lets the requester start this particular request at a
  // different section than the Admin-configured default order - the rest of
  // the chain keeps its relative order, just starting from that point. The
  // resulting order is saved on the asset itself so later steps (nextStage)
  // follow this request's own path instead of the global default.
  const chosenFirstStage = document.getElementById('f-firststage').value;
  const requestStageOrder = STAGE_ORDER.includes(chosenFirstStage)
    ? [chosenFirstStage, ...STAGE_ORDER.filter(s=>s!==chosenFirstStage)]
    : STAGE_ORDER.slice();
  const firstStage = requestStageOrder[0];
  const asset = {
    fleetNo, category, make, model, year, rego:'', vin:'', riskAssessment:'Not completed',
    warrantyYears:'', warrantyHours:'', warrantyKm:'', fireExtId:'', fireExtSize:'',
    division, driver, comments:'', owner, deliveryDate:'', purchasePrice:price, paymentType,
    financedAmount:'', financeTerm:'', financeEndDate:'', financeAgreementNo:'', insuredValue:'',
    fuelFob:'', fleetCard:'', status:'Current', workflowStage: firstStage,
    requestedBy: state.role, requestStageOrder,
  };
  Object.assign(asset, customAddFieldValues);
  state.assets.unshift(asset);
  await saveAssets();
  showToast(`${fleetNo} created — task sent to ${STAGE_OWNER[firstStage]}.`);
  await sendWorkflowEmail(STAGE_OWNER[firstStage],
    `Fleet Task: ${fleetNo} ${make} ${model} — Action Required`,
    `Hi,\n\nA new fleet request has been submitted by ${state.role}.\n\n${fleetNo}: ${make} ${model} (${category})\nDivision: ${division}\nOwner: ${owner}\n\nPlease log into the Fleet Register app and complete ${STAGE_SECTION_DESCRIPTIONS[firstStage]}.\n\nOpen app: ${APP_LINK}\n\nRegards,\nAsphaltech Fleet Register`);
  state.tab = 'dashboard';
  render();
}

// ===================== TASKS =====================
function renderTasks(container){
  const myStageAssets = state.assets.filter(a => STAGE_OWNER[a.workflowStage] === state.role);
  const myDisposalAssets = state.assets.filter(a => DISPOSAL_STAGE_OWNER[a.workflowStage] === state.role);
  container.innerHTML = `
    <div class="card">
      <h2>My Tasks &mdash; ${state.role}</h2>
      <div class="desc">Assets waiting on your team to complete their part.</div>
      <div id="task-list"></div>
    </div>`;
  const list = document.getElementById('task-list');
  const all = [...myStageAssets.map(a=>({a,kind:'new'})), ...myDisposalAssets.map(a=>({a,kind:'disposal'}))];
  if (!all.length){ list.innerHTML = `<div class="empty">No pending tasks &mdash; you're all caught up.</div>`; return; }
  all.forEach(({a,kind})=>{
    const div = document.createElement('div');
    div.className = 'task';
    div.innerHTML = `
      <div>
        <div class="title">${a.fleetNo} &mdash; ${a.make} ${a.model}</div>
        <div class="meta">${kind==='disposal' ? 'Disposal task' : 'New fleet task'} &middot; Requested by ${a.requestedBy||'—'}</div>
      </div>
      <button class="primary small" data-fleet="${a.fleetNo}" data-kind="${kind}">Open & complete</button>
    `;
    div.querySelector('button').onclick = ()=> openTaskModal(a, kind);
    list.appendChild(div);
  });
}

function openTaskModal(asset, kind){
  const overlay = document.createElement('div');
  overlay.style = 'position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:60;';
  const box = document.createElement('div');
  box.style = 'background:#fff;border-radius:14px;padding:22px;max-width:520px;width:92%;max-height:85vh;overflow:auto;';
  box.innerHTML = renderTaskForm(asset, kind);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if (e.target===overlay) document.body.removeChild(overlay); };
  wireTaskForm(box, overlay, asset, kind);
}

function renderTaskForm(a, kind){
  if (kind === 'new'){
    const currentStage = a.workflowStage;
    if (!STAGE_OWNER[currentStage]) return '<div class="empty">No action available.</div>';
    const next = nextStage(currentStage, a.requestStageOrder);
    const btnLabel = next === 'Complete' ? 'Complete asset onboarding' : `Complete &rarr; send to ${STAGE_OWNER[next]}`;
    const defaultNotify = next === 'Complete' ? 'CEO / Peter' : STAGE_OWNER[next];
    const fields = FIELD_REGISTRY.filter(f => FIELD_ASSIGNMENTS[f.key] === currentStage)
      .concat(CUSTOM_FIELDS.filter(f => f.section === currentStage));
    return `<h2 style="color:var(--navy);margin-top:0;">${a.fleetNo} &mdash; ${STAGE_OWNER[currentStage]}</h2>
    <div class="formgrid">
      ${fields.length ? fields.map(f=>renderFieldInput(f, a)).join('') : '<div class="empty" style="grid-column:1/-1;">No fields assigned to this section &mdash; see Admin &rarr; Field Assignments.</div>'}
      <div class="field"><label>Notify</label>
      <select id="t-notify">
        ${FULL_ACCESS_ROLES.map(r=>`<option value="${r}" ${r===defaultNotify?'selected':''}>${r}</option>`).join('')}
      </select></div>
    </div>
    <div class="btnrow"><button class="primary" id="t-submit">${btnLabel}</button>
    <button class="secondary" id="t-cancel">Cancel</button></div>`;
  }
  if (kind === 'disposal'){
    const currentStage = a.workflowStage;
    if (!DISPOSAL_STAGE_OWNER[currentStage]) return '<div class="empty">No action available.</div>';
    const next = nextDisposalStage(currentStage);
    const btnLabel = next ? `Complete &rarr; send to ${DISPOSAL_STAGE_OWNER[next]}` : 'Finalise &rarr; move to Disposed Fleet';
    const defaultNotify = next ? DISPOSAL_STAGE_OWNER[next] : 'CEO / Peter';
    const items = DISPOSAL_CHECKLIST_REGISTRY.filter(c => DISPOSAL_CHECKLIST_ASSIGNMENTS[c.key] === currentStage);
    return `<h2 style="color:var(--navy);margin-top:0;">${a.fleetNo} &mdash; Disposal: ${DISPOSAL_STAGE_OWNER[currentStage]}</h2>
    ${items.length ? items.map((c,i)=>`<div class="checklist-item"><input type="checkbox" id="c${i}"><label for="c${i}">${c.label}</label></div>`).join('') : '<div class="empty">No checklist items assigned to this section &mdash; see Admin &rarr; Field Assignments.</div>'}
    <div class="field"><label>Notify</label>
      <select id="t-notify">
        ${FULL_ACCESS_ROLES.map(r=>`<option value="${r}" ${r===defaultNotify?'selected':''}>${r}</option>`).join('')}
      </select></div>
    <div class="btnrow"><button class="primary" id="t-submit">${btnLabel}</button>
    <button class="secondary" id="t-cancel">Cancel</button></div>`;
  }
  return '<div class="empty">No action available.</div>';
}

function wireTaskForm(box, overlay, asset, kind){
  const cancel = box.querySelector('#t-cancel');
  if (cancel) cancel.onclick = ()=> document.body.removeChild(overlay);
  const submit = box.querySelector('#t-submit');
  if (!submit) return;
  submit.onclick = async ()=>{
    const idx = state.assets.findIndex(x=>x.fleetNo===asset.fleetNo);
    if (idx === -1) return;
    const a = state.assets[idx];

      if (kind==='new'){
        const appLink = APP_LINK;
        const currentStage = a.workflowStage;
        // Collect whichever fields are CURRENTLY assigned to this section - tied
        // to Admin > Field Assignments, not hardcoded to the section name.
        FIELD_REGISTRY.filter(f => FIELD_ASSIGNMENTS[f.key] === currentStage)
          .concat(CUSTOM_FIELDS.filter(f => f.section === currentStage))
          .forEach(f=>{
            const el = box.querySelector(`#t-${f.key}`);
            if (el) a[f.key] = el.value;
          });

        const next = nextStage(currentStage, a.requestStageOrder);
        a.workflowStage = next;
        const notifySel = box.querySelector('#t-notify');
        const notifyTo = notifySel ? notifySel.value : (next === 'Complete' ? 'CEO / Peter' : STAGE_OWNER[next]);

        if (next === 'Complete'){
          showToast(`${a.fleetNo} onboarding complete!`);
          await sendWorkflowEmail(notifyTo,
            `Fleet Register: ${a.fleetNo} ${a.make} ${a.model} — Onboarding Complete`,
            `Hi,\n\n${a.fleetNo} (${a.make} ${a.model}) has been fully onboarded into the Fleet Register.\n\nDivision: ${a.division}\nDriver: ${a.driver}\nRego: ${a.rego}\n\nOpen app: ${appLink}\n\nRegards,\nAsphaltech Fleet Register`);
        } else {
          showToast(`${a.fleetNo} sent to ${STAGE_OWNER[next]}.`);
          await sendWorkflowEmail(notifyTo,
            `Fleet Task: ${a.fleetNo} ${a.make} ${a.model} — Action Required`,
            `Hi,\n\n${STAGE_OWNER[currentStage]} has completed their section for ${a.fleetNo} (${a.make} ${a.model}).\n\nPlease log into the Fleet Register app and complete ${STAGE_SECTION_DESCRIPTIONS[next]}.\n\nOpen app: ${appLink}\n\nRegards,\nAsphaltech Fleet Register`);
        }
      } else if (kind==='disposal'){
        const appLink = APP_LINK;
        const currentStage = a.workflowStage;
        const next = nextDisposalStage(currentStage);
        const notifySel = box.querySelector('#t-notify');

        if (next){
          a.workflowStage = next;
          const notifyTo = notifySel ? notifySel.value : DISPOSAL_STAGE_OWNER[next];
          showToast(`${a.fleetNo} sent to ${DISPOSAL_STAGE_OWNER[next]} for further disposal steps.`);
          await sendWorkflowEmail(notifyTo,
            `Disposal Task: ${a.fleetNo} ${a.make} ${a.model} — Action Required`,
            `Hi,\n\n${DISPOSAL_STAGE_OWNER[currentStage]} has completed their steps for the disposal of ${a.fleetNo} (${a.make} ${a.model}).\n\nPlease complete ${DISPOSAL_SECTION_DESCRIPTIONS[next]}.\n\nOpen app: ${appLink}\n\nRegards,\nAsphaltech Fleet Register`);
        } else {
          a.status = 'Sold';
          state.disposed.unshift({...a, disposalDate: new Date().toISOString().slice(0,10)});
          state.assets = state.assets.filter(x=>x.fleetNo!==a.fleetNo);
          await saveDisposed();
          const notifyTo = notifySel ? notifySel.value : 'CEO / Peter';
          showToast(`${a.fleetNo} moved to Disposed Fleet.`);
          await sendWorkflowEmail(notifyTo,
            `Fleet Register: ${a.fleetNo} ${a.make} ${a.model} — Disposal Complete`,
            `Hi,\n\n${a.fleetNo} (${a.make} ${a.model}) has been fully disposed of and removed from the live Fleet Register.\n\nDisposal date: ${new Date().toISOString().slice(0,10)}\nReason: ${a.disposalReason||'Not specified'}\n\nOpen app: ${appLink}\n\nRegards,\nAsphaltech Fleet Register`);
        }
      }
    await saveAssets();
    document.body.removeChild(overlay);
    render();
  };
}

// ===================== DISPOSAL =====================
function renderDisposal(container){
  const current = state.assets.filter(a=>a.status==='Current' && a.workflowStage==='Complete');
  const inProgress = state.assets.filter(a=>a.workflowStage && a.workflowStage.startsWith('Disposal:'));
  container.innerHTML = `
    <div class="card">
      <h2>Start a Disposal</h2>
      <div class="desc">Select an asset being sold, traded, or written off. This routes to ${DISPOSAL_STAGE_ORDER.map(s=>DISPOSAL_STAGE_OWNER[s]).join(', then ')}, then removes it from the live register. Change the order in Admin &rarr; Workflow Order, or who's assigned in Admin &rarr; Workflow Routing.</div>
      <div class="formgrid">
        <div class="field" style="grid-column:1/-1;"><label>Asset</label>
          <select id="d-asset">
            <option value="">Select Fleet No...</option>
            ${current.map(a=>`<option value="${a.fleetNo}">${a.fleetNo} — ${a.make} ${a.model}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Reason</label><select id="d-reason">
          <option>Sold</option><option>Traded</option><option>Written off</option><option>Other</option>
        </select></div>
        <div class="field"><label>Sale Price / Trade Value ($)</label><input id="d-price" type="number"></div>
      </div>
      <div class="btnrow"><button class="primary" id="d-submit">Start disposal &rarr; sends to ${DISPOSAL_STAGE_OWNER[DISPOSAL_STAGE_ORDER[0]]}</button></div>
    </div>
    <div class="card">
      <h2>Disposals In Progress</h2>
      <div class="desc">Started by mistake? Cancel here to send the asset back to the live register.</div>
      <div class="tablewrap"><table>
        <tr><th>Fleet No.</th><th>Make/Model</th><th>Stage</th><th>Reason</th><th>Sale/Trade Value</th><th></th></tr>
        ${inProgress.length ? inProgress.map(a=>`<tr>
          <td>${a.fleetNo}</td><td>${a.make} ${a.model}</td>
          <td><span class="pill stage">${stageDisplayLabel(a.workflowStage)}</span></td>
          <td>${a.disposalReason||''}</td><td>${a.salePrice||''}</td>
          <td><button class="secondary small cancel-disposal" data-fleet="${a.fleetNo}">Cancel Disposal</button></td>
        </tr>`).join('') : '<tr><td colspan="6" class="empty">No disposals in progress.</td></tr>'}
      </table></div>
    </div>
    <div class="card">
      <h2>Disposed Fleet (Historical)</h2>
      <div class="tablewrap"><table>
        <tr><th>Fleet No.</th><th>Make/Model</th><th>Disposal Date</th><th>Reason</th></tr>
        ${state.disposed.length ? state.disposed.map(d=>`<tr><td>${d.fleetNo}</td><td>${d.make} ${d.model}</td><td>${d.disposalDate||''}</td><td>${d.disposalReason||''}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">No disposed assets yet.</td></tr>'}
      </table></div>
    </div>`;
  container.querySelectorAll('.cancel-disposal').forEach(btn=>{
    btn.onclick = async ()=>{
      const fleetNo = btn.getAttribute('data-fleet');
      const idx = state.assets.findIndex(a=>a.fleetNo===fleetNo);
      if (idx===-1) return;
      state.assets[idx].workflowStage = 'Complete';
      delete state.assets[idx].disposalReason;
      delete state.assets[idx].salePrice;
      await saveAssets();
      showToast(`${fleetNo} disposal cancelled — back in the live register.`);
      render();
    };
  });
  document.getElementById('d-submit').onclick = async ()=>{
    const fleetNo = document.getElementById('d-asset').value;
    const reason = document.getElementById('d-reason').value;
    const price = document.getElementById('d-price').value;
    if (!fleetNo){ showToast('Select an asset first.'); return; }
    const idx = state.assets.findIndex(a=>a.fleetNo===fleetNo);
    if (idx===-1) return;
    const firstDisposalStage = DISPOSAL_STAGE_ORDER[0];
    state.assets[idx].workflowStage = firstDisposalStage;
    state.assets[idx].disposalReason = reason;
    state.assets[idx].salePrice = price;
    await saveAssets();
    showToast(`${fleetNo} disposal started — sent to ${DISPOSAL_STAGE_OWNER[firstDisposalStage]}.`);
    const a = state.assets[idx];
    await sendWorkflowEmail(DISPOSAL_STAGE_OWNER[firstDisposalStage],
      `Disposal Task: ${a.fleetNo} ${a.make} ${a.model} — Action Required`,
      `Hi,\n\nA disposal has been started for ${a.fleetNo} (${a.make} ${a.model}).\n\nReason: ${reason}\nSale/Trade Value: ${price||'Not specified'}\n\nPlease complete ${DISPOSAL_SECTION_DESCRIPTIONS[firstDisposalStage]}.\n\nOpen app: ${APP_LINK}\n\nRegards,\nAsphaltech Fleet Register`);
    render();
  };
}

async function cloudSendTeams(webhookUrl, title, text, mention){
  if (!apiConfigured()) return false;
  try {
    const r = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'teams', webhookUrl, title, text, mention })
    });
    if (!r.ok) return false;
    const data = await r.json().catch(()=>null);
    return !!(data && data.ok);
  } catch(e){ console.warn('Teams notification failed:', e); return false; }
}

async function sendWorkflowEmail(toRole, subject, body){
  // Teams notification - reaches people even if they haven't opened the app at all.
  const webhooks = state.settings && state.settings.teamsWebhooks;
  const webhookUrl = webhooks && webhooks[toRole];
  if (webhookUrl){
    const settingsEmails2 = state.settings && state.settings.emails;
    const mentionEmail = settingsEmails2 && settingsEmails2[toRole];
    const teamsNames = state.settings && state.settings.teamsNames;
    const mentionName = (teamsNames && teamsNames[toRole]) || toRole;
    const mention = mentionEmail ? { id: mentionEmail, name: mentionName } : null;
    const sent = await cloudSendTeams(webhookUrl, subject, body, mention);
    if (!sent) showToast(`Couldn't reach Teams for ${toRole}.`);
  }

  // Also open a pre-filled draft in desktop Outlook (via mailto:), in addition
  // to Teams, so both channels always fire. Requires Outlook to be set as the
  // Windows default MAILTO handler - if it silently does nothing, check that
  // Chrome didn't previously block the "Open Microsoft Outlook?" prompt.
  const settingsEmails = state.settings && state.settings.emails;
  const toEmail = (settingsEmails && settingsEmails[toRole]) || ROLE_EMAILS[toRole];
  if (!toEmail){ console.log('No email set for role:', toRole); return; }
  const mailto = `mailto:${encodeURIComponent(toEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = mailto;
}

const EXCEL_DATE_FIELDS = ['deliveryDate', 'financeEndDate'];

function excelSerialToISODate(n){
  // Excel's date epoch is 1899-12-30; convert a serial day number back to YYYY-MM-DD.
  // (Guards against re-importing a field that Excel silently reformatted as a date.)
  const ms = Math.round((n - 25569) * 86400 * 1000);
  const d = new Date(ms);
  if (isNaN(d.getTime())) return n;
  return d.toISOString().slice(0,10);
}

function collectAssetColumns(list){
  const seen = new Set(['fleetNo']);
  const cols = ['fleetNo'];
  list.forEach(item=>{
    Object.keys(item).forEach(k=>{
      if (!seen.has(k)){ seen.add(k); cols.push(k); }
    });
  });
  return cols;
}

function importRowsIntoAssets(rows){
  let updated = 0, added = 0, skipped = 0;
  rows.forEach(row=>{
    const fleetNo = (row.fleetNo !== undefined && row.fleetNo !== null) ? String(row.fleetNo).trim() : '';
    if (!fleetNo){ skipped++; return; }
    const clean = Object.assign({}, row, { fleetNo });
    EXCEL_DATE_FIELDS.forEach(f=>{
      if (typeof clean[f] === 'number') clean[f] = excelSerialToISODate(clean[f]);
    });
    const existing = state.assets.find(a=> String(a.fleetNo) === fleetNo);
    if (existing){
      Object.assign(existing, clean);
      updated++;
    } else {
      state.assets.push(clean);
      added++;
    }
  });
  return { updated, added, skipped };
}

      return el ? el.value : STAGE_OWNER[stage];
    }).join(' &rarr; ');
    const dOrder = currentOrderSelection('order-disposal', 2, DISPOSAL_STAGE_ORDER);
    const disposalChain = dOrder.map(stage=>{
      const el = document.getElementById(`route-${stage.replace(/\W/g,'_')}`);
      return el ? el.value : DISPOSAL_STAGE_OWNER[stage];
    }).join(' &rarr; ');
    const preview = document.getElementById('routing-preview');
    if (preview) preview.innerHTML =
      `<strong>New fleet requests:</strong> ${newChain}<br>` +
      `<strong>Disposals:</strong> ${disposalChain} &rarr; removed from live register`;
  }
  container.querySelectorAll('select[id^="route-"], select[id^="order-new-"], select[id^="order-disposal-"]').forEach(sel=>{ sel.onchange = updateRoutingPreview; });
  updateRoutingPreview();

  // Export backup
  document.getElementById('export-backup').onclick = ()=>{
    const blob = new Blob([JSON.stringify({assets:state.assets,disposed:state.disposed,settings:state.settings},null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `fleet_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
  };

  // Export register to Excel
  document.getElementById('export-excel-btn').onclick = ()=>{
    if (typeof XLSX === 'undefined'){ showToast('Excel library did not load — check your internet connection and try again.'); return; }
    const cols = collectAssetColumns(state.assets);
    const rows = state.assets.map(a=>{
      const o = {};
      cols.forEach(c=> o[c] = (a[c] !== undefined && a[c] !== null) ? a[c] : '');
      return o;
    });
    const ws = XLSX.utils.json_to_sheet(rows, {header:cols});
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Assets');
    XLSX.writeFile(wb, `fleet_register_${new Date().toISOString().slice(0,10)}.xlsx`);
  };

  // Import bulk changes from Excel
  document.getElementById('import-excel-btn').onclick = ()=>{
    if (typeof XLSX === 'undefined'){ showToast('Excel library did not load — check your internet connection and try again.'); return; }
    document.getElementById('import-excel-input').click();
  };
  document.getElementById('import-excel-input').onchange = (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try {
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const sheetName = wb.SheetNames[0];
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:''});
        const result = importRowsIntoAssets(rows);
        saveAssets().then(()=>{
          render();
          showToast(`Bulk update: ${result.updated} updated, ${result.added} added` + (result.skipped ? `, ${result.skipped} skipped (no Fleet No)` : '') + '.');
        });
      } catch(err){
        showToast('Could not read that file — make sure it\'s the exported .xlsx.');
        console.warn(err);
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  };

  // Self-update
  document.getElementById('self-update-btn').onclick = ()=>{
    const code = document.getElementById('self-update-code').value.trim();
    if (!code || !code.includes('<html')){ showToast('Please paste a valid HTML app.'); return; }
    const blob = new Blob([code], {type:'text/html'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'Asphaltech_Fleet_Register_updated.html'; a.click();
    showToast('Downloaded — re-share this file with your team to update their copies.');
  };

  // Save settings
  document.getElementById('save-settings-btn').onclick = async ()=>{
    const newStageOrder = currentOrderSelection('order-new', 3, STAGE_ORDER);
    const newDisposalStageOrder = currentOrderSelection('order-disposal', 2, DISPOSAL_STAGE_ORDER);
    if (!isValidOrder(newStageOrder, Object.keys(STAGE_OWNER))){
      showToast('New Fleet Request order must use each section exactly once — fix the Workflow Order dropdowns and try again.');
      return;
    }
    if (!isValidOrder(newDisposalStageOrder, Object.keys(DISPOSAL_STAGE_OWNER))){
      showToast('Disposal order must use each section exactly once — fix the Workflow Order dropdowns and try again.');
      return;
    }
    const newFieldAssignments = {};
    FIELD_REGISTRY.forEach(f=>{
      const el = document.getElementById(`fieldassign-${f.key}`);
      if (el) newFieldAssignments[f.key] = el.value;
    });
    const newDisposalChecklistAssignments = {};
    DISPOSAL_CHECKLIST_REGISTRY.forEach(c=>{
      const el = document.getElementById(`dispfieldassign-${c.key}`);
      if (el) newDisposalChecklistAssignments[c.key] = el.value;
    });

    const newPins = {};
    ROLES.filter(r=>r!=='General Staff').forEach(r=>{
      const el = document.getElementById(`pin-${r.replace(/\W/g,'_')}`);
      if (el) newPins[r] = el.value;
    });
    const newEmails = {};
    ['CEO / Peter','Fleet Maintenance','Accounts','HR'].forEach(r=>{
      const el = document.getElementById(`email-${r.replace(/\W/g,'_')}`);
      if (el) newEmails[r] = el.value;
    });
    const newTeamsWebhooks = {};
    ['CEO / Peter','Fleet Maintenance','Accounts','HR'].forEach(r=>{
      const el = document.getElementById(`teams-${r.replace(/\W/g,'_')}`);
      if (el) newTeamsWebhooks[r] = el.value.trim();
    });
    const newTeamsNames = {};
    ['CEO / Peter','Fleet Maintenance','Accounts','HR'].forEach(r=>{
      const el = document.getElementById(`teamsname-${r.replace(/\W/g,'_')}`);
      if (el) newTeamsNames[r] = el.value.trim();
    });
    const newDivisions = [...document.querySelectorAll('.div-item')].map(i=>i.value).filter(Boolean);
    const newCats = [...document.querySelectorAll('.cat-item')].map(i=>i.value).filter(Boolean);
    const newCustomFields = [...document.querySelectorAll('.custom-field-row')].map(row=>({
      key: row.dataset.key,
      label: row.querySelector('.cf-label').value.trim(),
      type: row.querySelector('.cf-type').value,
      section: row.querySelector('.cf-section').value,
    })).filter(f=>f.label);
    // Register Columns: only store explicit `false` entries (unticked), so
    // any column added later (e.g. a brand-new custom field) defaults to
    // visible without needing to be listed here first.
    const newRegisterColumns = {};
    container.querySelectorAll('.registercol-item').forEach(cb=>{
      if (!cb.checked) newRegisterColumns[cb.dataset.key] = false;
    });
    const newAppLink = document.getElementById('applink-input').value.trim();
    const newAdminPin = document.getElementById('pin-ADMIN').value.trim();
    const newStageOwners = {};
    Object.keys(STAGE_OWNER).forEach(stage=>{
      const el = document.getElementById(`route-${stage.replace(/\W/g,'_')}`);
      if (el) newStageOwners[stage] = el.value;
    });
    const newDisposalStageOwners = {};
    Object.keys(DISPOSAL_STAGE_OWNER).forEach(stage=>{
      const el = document.getElementById(`route-${stage.replace(/\W/g,'_')}`);
      if (el) newDisposalStageOwners[stage] = el.value;
    });

    Object.assign(ROLE_PINS, newPins);
    if (newAdminPin) ROLE_PINS['Admin'] = newAdminPin;
    Object.assign(STAGE_OWNER, newStageOwners);
    Object.assign(DISPOSAL_STAGE_OWNER, newDisposalStageOwners);
    STAGE_ORDER = newStageOrder;
    DISPOSAL_STAGE_ORDER = newDisposalStageOrder;
    Object.assign(FIELD_ASSIGNMENTS, newFieldAssignments);
    Object.assign(DISPOSAL_CHECKLIST_ASSIGNMENTS, newDisposalChecklistAssignments);
    if (!state.settings) state.settings = {};
    state.settings.pins = newPins;
    state.settings.emails = newEmails;
    state.settings.teamsWebhooks = newTeamsWebhooks;
    state.settings.teamsNames = newTeamsNames;
    state.settings.stageOwners = newStageOwners;
    state.settings.disposalStageOwners = newDisposalStageOwners;
    state.settings.stageOrder = newStageOrder;
    state.settings.disposalStageOrder = newDisposalStageOrder;
    state.settings.fieldAssignments = newFieldAssignments;
    state.settings.disposalChecklistAssignments = newDisposalChecklistAssignments;
    state.settings.divisions = newDivisions;
    state.settings.categories = newCats;
    state.settings.customFields = newCustomFields;
    state.settings.registerColumns = newRegisterColumns;
    CUSTOM_FIELDS = newCustomFields.map(buildCustomFieldRuntime);
    if (newAppLink){ state.settings.appLink = newAppLink; APP_LINK = newAppLink; }
    state.settings.adminPin = newAdminPin;

    try {
      await storageSet('fleet_settings', JSON.stringify(state.settings));
      // Also save to localStorage as backup
      try { localStorage.setItem('fleet_settings_backup', JSON.stringify(state.settings)); } catch(e){}
      showToast('✓ Settings saved successfully!');
    } catch(e){
      showToast('Settings saved in memory (storage unavailable).');
    }
  };
}

</script>
</body>
</html>
